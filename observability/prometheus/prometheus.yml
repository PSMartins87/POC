global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node_backend"
    metrics_path: "/api/metrics/metrics"
    static_configs:
      - targets: ["node-backend:3000"]
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: "keycloak"
    metrics_path: "q/metrics"
    static_configs:
      - targets: ["keycloak:8080"]
