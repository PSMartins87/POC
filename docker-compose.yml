# docker-compose.yml
networks:
  public_net:
    driver: bridge
  backend_net:
    driver: bridge
  data_net:
    driver: bridge
  obs_net:
    driver: bridge

x-default-config: &default-config
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ==========================================
  # DATABASES & BROKERS
  # ==========================================
  postgres:
    <<: *default-config
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-financeiro:
    <<: *default-config
    image: redis:7-alpine
    container_name: redis-financeiro
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_financeiro_data:/data
    networks:
      - data_net

  redis-admin:
    <<: *default-config
    image: redis:7-alpine
    container_name: redis-admin
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - data_net

  rabbitmq:
    <<: *default-config
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data_net

  zookeeper:
    <<: *default-config
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - data_net

  kafka:
    <<: *default-config
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data_net

  # ==========================================
  # INFRASTRUCTURE & IDENTITY
  # ==========================================
  keycloak:
    <<: *default-config
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev 
    environment:
      KC_FEATURES: admin-fine-grained-authz,token-exchange
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
      - data_net

  # ==========================================
  # MICROSERVICES (Spring Boot)
  # ==========================================
  iam-service:
    <<: *default-config
    build: ./iam-service
    container_name: spring-iam-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/keycloak
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092 
    volumes:
      - ./iam-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    labels:
      app: spring-iam
    networks:
      - backend_net
      - data_net

  notification-service:
    <<: *default-config
    build: ./notification-service
    container_name: spring-notification-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - rabbitmq
    labels:
      app: spring-notification
    networks:
      - backend_net
      - data_net

  # ==========================================
  # BACKENDS (BFFs)
  # ==========================================
  bff-financeiro:
    <<: *default-config
    build: ./bff-financeiro
    container_name: bff-financeiro
    ports:
      - "3000:3000"
    env_file: # 👈 APENAS env_file
      - ./bff-financeiro/.env
    depends_on:
      - keycloak
      - redis-financeiro
      - rabbitmq
      - kafka
    labels:
      app: bff-financeiro
    networks:
      - backend_net
      - data_net
      - public_net

  bff-admin:
    <<: *default-config
    build:
      context: ./bff-admin
      dockerfile: Dockerfile
    container_name: bff-admin
    ports:
      - "3002:3001"
    env_file: # 👈 APENAS env_file
      - ./bff-admin/.env
    depends_on:
      - keycloak
      - redis-admin
      - rabbitmq
      - kafka
      - iam-service
    networks:
      - backend_net
      - data_net
      - public_net

  # ==========================================
  # FRONTENDS
  # ==========================================
  frontend-financeiro:
    <<: *default-config
    build: ./frontend-financeiro
    container_name: frontend-financeiro
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-financeiro:/app
      - /app/node_modules
    depends_on:
      - bff-financeiro
    networks:
      - public_net

  frontend-admin:
    <<: *default-config
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: frontend-admin
    ports:
      - "5174:5173"
    depends_on:
      - bff-admin
    networks:
      - public_net

  # ==========================================
  # OBSERVABILITY & TOOLS
  # ==========================================
  kafka-ui:
    <<: *default-config
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080" 
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - data_net
      - obs_net

  prometheus:
    <<: *default-config
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus:/etc/prometheus
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - bff-financeiro
      - bff-admin
    networks:
      - obs_net
      - backend_net

  loki:
    <<: *default-config
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - obs_net

  alloy:
    <<: *default-config
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - obs_net

  grafana:
    <<: *default-config
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - obs_net

  redis-exporter:
    <<: *default-config
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis-financeiro:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis-financeiro
    networks:
      - data_net
      - obs_net

volumes:
  pgdata:
  redis_financeiro_data:
  prom_data:
  grafana_data:
  rabbitmq_data:
  zookeeper_data: 
  zookeeper_log:  
  kafka_data: